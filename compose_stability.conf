// The core's state types are immutable `val` data classes, but they hold Map/List members, so
// the Compose compiler infers them UNSTABLE and no composable taking them can ever skip. A focus
// rung changes AppState identity, so every rung-frame re-invoked the whole HUD — measured at
// ~6.5 ms of main-thread work per changed frame, ~39% of a core during a spin.
com.mobiledivecontrol.core.AppState
com.mobiledivecontrol.core.CameraState
com.mobiledivecontrol.core.SafetyState
com.mobiledivecontrol.core.HousingState
com.mobiledivecontrol.core.PermissionsState
com.mobiledivecontrol.core.PhoneControlState
com.mobiledivecontrol.core.GalleryState
com.mobiledivecontrol.core.CameraSettingSpec
com.mobiledivecontrol.core.SliderSensitivity
